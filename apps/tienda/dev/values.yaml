# Valores de la tienda en dev. Promover una versión = cambiar las etiquetas de abajo en un PR.
imagen:
  registro: ghcr.io/amilcar-steban
api:
  etiqueta: "sha-412125e"
  replicas: 2
  hpa:
    enabled: false # las réplicas las gestiona el Rollout (manifiestos/rollout.yaml)
  bd:
    host: postgres
    sslmode: disable
  redisUrl: redis://valkey:6379/0
frontend:
  etiqueta: "sha-412125e"
  replicas: 2
gateway:
  crear: true
  hostname: dev.tienda.localhost
local:
  enabled: true # laboratorio en kind: PostgreSQL y Valkey en el clúster (en EKS, RDS y ElastiCache)
