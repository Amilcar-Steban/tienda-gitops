# Componentes de plataforma, cada uno con su versión fijada. Ola 0: antes que la tienda (ola 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: plataforma
  source:
    repoURL: docker.io/envoyproxy # chart OCI: necesita el repositorio declarado con enableOCI (bootstrap)
    chart: gateway-helm
    targetRevision: v1.9.3
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # los CRDs de Envoy Gateway superan el límite de la anotación de kubectl apply
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatewayclass
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: plataforma
  source:
    repoURL: https://github.com/Amilcar-Steban/tienda-gitops
    targetRevision: main
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - SkipDryRunOnMissingResource=true # el CRD GatewayClass lo instala la app anterior
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2 }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: plataforma
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        args: [--kubelet-insecure-tls] # solo kind: certificados autofirmados en el kubelet
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: plataforma
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8
    helm:
      valuesObject:
        dashboard: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
